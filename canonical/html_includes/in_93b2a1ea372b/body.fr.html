<html>
    <script src="https://www.50ohm.de/assets/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://www.50ohm.de/assets/chartjs/4.4.1/chart.min.js"></script>

    <p>
    En appuyant sur le bouton "Activer le microphone", le microphone du navigateur
    est activé. Ensuite, vous pouvez examiner le spectre de votre propre voix. En appuyant sur le bouton "Désactiver le microphone", le microphone du navigateur
    est désactivé.
    </p>

    <p>
        <button onclick="start()">Activer le microphone</button>
        <button onclick="stop()">Désactiver le microphone</button>
    </p>

    <p>
        <canvas id="Spectrum" style="max-height:200px;"></canvas>
    </p>

    Amplitude la plus forte à la fréquence f =
    <div id="mainfrequency" style="display:inline-block;">0</div> Hz<br>

    <script type="text/javascript">

        // Globale Variablen
        var initialized = false;
        var binSize = 0;
        var audioContext;
        var analyserNode;
        var frequencyData;
        var animationId;
        var mediaStream;

        spectrum = new Chart("Spectrum", {
            type: 'scatter',
            data: {
                labels: [],
                datasets: [
                    {
                        fill: false,
                        pointRadius: function(context) {
                            var index = context.dataIndex;
                            var value = context.dataset.data[index];
                            var max = Math.max.apply(null,context.dataset.data);
                            return value == max ? 6 : 0;
                        },
                        lineTension: 0.8,
                        showLine: true,
                        borderColor: function(context) { 
                            var index = context.dataIndex;
                            var value = context.dataset.data[index];
                            var max = Math.max.apply(null,context.dataset.data);
                            return value == max ? "#FF756D" : "#00AEDF";
                        },
                        data: [],
                    },
                ]
            },    
            options: {
                responsive:true,
                plugins: {
                    legend: {
                        display: false,
                    }
                },
                scales: {
                    y: {
                        min: 0,
                        max: 100,
                        ticks: {
                            callback: function(value) {
                                return value + "%";
                            }
                        }
                    },
                    x: {
                        min: 0,
                        max: 24000,
                        type: 'logarithmic',
                        title: {
                            display: true,
                            text: 'Frequenz'
                        },
                        ticks: {
                            callback: function(val) {
                                return val+"Hz";
                            },
                        }
                    }
                },
            }
        });

        const getBigBinIndex = (frequencyBins) => {
            let biggestIndex = 0;
            frequencyBins.forEach((bin, index) => {
                if (bin > frequencyBins[biggestIndex]) {
                    biggestIndex = index;
                }
            });
            return biggestIndex;
        }

        const init = () => {
            var fftSize = 2048;
            var lastUpdate = 0;

            try {
                window.AudioContext = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioContext();
                binSize = (audioContext.sampleRate) / fftSize;
            } catch (e) {
                alert('Die Web Audio API wird in diesem Browser leider nicht unterstützt!');
            }

            const update = (timestamp) => {
                if (timestamp - lastUpdate > 50) {
                    analyserNode.getByteFrequencyData(frequencyData);

                    const bigBinIndex = getBigBinIndex(frequencyData);
                    const mainFrequencyStart = Math.floor(bigBinIndex * audioContext.sampleRate / fftSize);

                    document.getElementById('mainfrequency').textContent = mainFrequencyStart;

                    lastUpdate = timestamp;

                    spectrum.data.datasets[0].data = [];
                    spectrum.data.labels = [];

                    for(let i = 0; i < analyserNode.frequencyBinCount; i++) {
                        spectrum.data.datasets[0].data.push((frequencyData[i]/255)*100); 
                        spectrum.data.labels.push(i*binSize);
                    }

                    spectrum.update();
                }
                animationId = requestAnimationFrame(update);
            }

            navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
            }).then(stream => {
                mediaStream = stream;

                var source = audioContext.createMediaStreamSource(stream);
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = fftSize;

                source.connect(analyserNode);

                frequencyData = new Uint8Array(analyserNode.frequencyBinCount);

                animationId = requestAnimationFrame(update);
            });
        }

        const start = () => {
            if (!initialized) {
                init();
                initialized = true;
            }
        }

        const stop = () => {
            // Animation stoppen
            if (animationId) {
                cancelAnimationFrame(animationId);
            }

            // Mikrofon stoppen
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
            }

            // AudioContext schließen
            if (audioContext) {
                audioContext.close();
            }

            initialized = false;
        }

    </script>
</html>
