<details class="header-beta-warning">
  <summary class="d-flex align-items-center gap-1" style="cursor: pointer;" aria-label="{{ ui('beta_warning_aria')|e }}">
    <span class="material-icons" aria-hidden="true">warning</span>
    <strong>BETA</strong>
  </summary>
  <div class="header-beta-disclaimer small">
    <p>{{ ui('beta_disclaimer') }}</p>
    {% if feedback_url %}
      <a class="btn btn-sm btn-outline-dark" data-feedback-link data-feedback-base="{{ feedback_url|e }}" href="{{ feedback_url|e }}" target="_blank" rel="noopener noreferrer">
        {{ ui('feedback_button') }}
      </a>
    {% endif %}
  </div>
</details>
